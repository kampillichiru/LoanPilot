spring.application.name=mcp-credit-bureau
server.port=8082
# Localhost only: this MCP server has no authentication yet. Production needs auth (OAuth in the MCP spec).
server.address=127.0.0.1

# --- MCP server ---
# Name, version and instructions are sent to every client in the MCP "initialize" handshake.
spring.ai.mcp.server.name=credit-bureau
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Mock Indian credit bureau (synthetic data). Returns credit report facts for loan applicants. It does not make lending decisions.
# Streamable HTTP transport at http://127.0.0.1:8082/mcp (these are the defaults, written out to make them visible).
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.type=sync

# --- Logging ---
logging.level.com.loanpilot=INFO
# DEBUG shows every MCP message (initialize, tools/list, tools/call). Local learning only: it logs tool results.
#logging.level.io.modelcontextprotocol=DEBUG
