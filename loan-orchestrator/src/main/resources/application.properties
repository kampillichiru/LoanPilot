spring.application.name=loan-orchestrator
server.port=8080

# --- Ollama (local LLM) ---
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
# Low temperature = more consistent answers. Try 0.0 vs 1.2 in POC 1 experiments.
spring.ai.ollama.chat.temperature=0.2

# Spring AI retries failed LLM calls (default: 10 attempts, 2s x5 backoff = minutes).
# Keep it short locally so failures show up fast. Production would tune this per SLA.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2

# --- Logging ---
# INFO: each LLM call's steps, timing, tokens (no prompt/slip content, which can contain PII).
logging.level.com.loanpilot=INFO
# DEBUG: full prompt sent + full LLM reply. Local learning only: it logs PII. Uncomment to see what the model sees.
#logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# --- LoanPilot ---
# Versioned system prompt (see src/main/resources/prompts/)
loanpilot.prompt.system=classpath:prompts/banking-assistant-v1.st
loanpilot.prompt.version=banking-assistant-v1

# --- POC 2: salary-slip extraction ---
# Versioned extraction instructions (system prompt). The JSON schema is appended by code, not here.
loanpilot.extract.prompt=classpath:prompts/extract-salary-slip-v2.st
loanpilot.extract.prompt-version=extract-salary-slip-v2
# Extraction should be repeatable: temperature 0 + fixed seed (see POC 1, experiment 5).
loanpilot.extract.temperature=0.0
loanpilot.extract.seed=42

# --- POC 3: tool calling ---
# Versioned advisor system prompt. Tools come from @Tool methods on LoanTools, not from this file.
loanpilot.advise.prompt=classpath:prompts/loan-advisor-v2.st
loanpilot.advise.prompt-version=loan-advisor-v2
loanpilot.advise.temperature=0.0
loanpilot.advise.seed=42
