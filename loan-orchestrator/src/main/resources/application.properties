spring.application.name=loan-orchestrator
server.port=8080

# --- Ollama (local LLM) ---
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
# Low temperature = more consistent answers. Try 0.0 vs 1.2 in POC 1 experiments.
spring.ai.ollama.chat.temperature=0.2

# Spring AI retries failed LLM calls (default: 10 attempts, 2s x5 backoff = minutes).
# Keep it short locally so failures show up fast. Production would tune this per SLA.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2

# --- Logging ---
# INFO: each LLM call's steps, timing, tokens (no prompt/slip content, which can contain PII).
logging.level.com.loanpilot=INFO
# DEBUG: full prompt sent + full LLM reply. Local learning only: it logs PII. Uncomment to see what the model sees.
#logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# --- LoanPilot ---
# Versioned system prompt (see src/main/resources/prompts/)
loanpilot.prompt.system=classpath:prompts/banking-assistant-v1.st
loanpilot.prompt.version=banking-assistant-v1

# --- POC 2: salary-slip extraction ---
# Versioned extraction instructions (system prompt). The JSON schema is appended by code, not here.
loanpilot.extract.prompt=classpath:prompts/extract-salary-slip-v2.st
loanpilot.extract.prompt-version=extract-salary-slip-v2
# Extraction should be repeatable: temperature 0 + fixed seed (see POC 1, experiment 5).
loanpilot.extract.temperature=0.0
loanpilot.extract.seed=42

# --- POC 3: tool calling ---
# Versioned advisor system prompt. Tools come from @Tool methods on LoanTools, not from this file.
loanpilot.advise.prompt=classpath:prompts/loan-advisor-v3.st
loanpilot.advise.prompt-version=loan-advisor-v3
loanpilot.advise.temperature=0.0
loanpilot.advise.seed=42

# --- POC 5: MCP client ---
# Tools on these MCP servers are discovered (tools/list) and offered to the model next to the local @Tool methods.
spring.ai.mcp.client.name=loan-orchestrator
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.streamable-http.connections.credit-bureau.url=http://127.0.0.1:8082
spring.ai.mcp.client.streamable-http.connections.credit-bureau.endpoint=/mcp
# Don't connect at startup: the orchestrator starts even if the bureau is down, and connects on first use.
spring.ai.mcp.client.initialized=false
# A bureau lookup is fast; don't let a hung server stall the agent loop for long.
spring.ai.mcp.client.request-timeout=10s

# --- POC 6: RAG over the credit policy ---
# Embedding model: turns text into 768 numbers. Chunks and questions must use the SAME model.
spring.ai.ollama.embedding.model=nomic-embed-text
# Qdrant vector database (local binary, no Docker). Spring AI talks gRPC on 6334; the REST API/dashboard is 6333.
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=credit-policy
# Don't touch Qdrant at startup: the collection is created on first ingest (QdrantVectorCollection),
# so the app still starts, and POC 1-5 still work, when Qdrant isn't running.
spring.ai.vectorstore.qdrant.initialize-schema=false
# Policy source (path relative to the loan-orchestrator folder, where the app is started)
loanpilot.policy.document=file:../policy-docs/credit-policy-v1.md
loanpilot.policy.doc-id=credit-policy-v1
loanpilot.policy.prompt=classpath:prompts/policy-qa-v2.st
loanpilot.policy.prompt-version=policy-qa-v2
# Retrieval: how many clauses the model sees, and the minimum cosine similarity to count as relevant.
# min-score was calibrated with evals/run_policy_rag.py --retrieval-only (see README).
loanpilot.policy.top-k=3
loanpilot.policy.min-score=0.5
loanpilot.policy.temperature=0.0
loanpilot.policy.seed=42
